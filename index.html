<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EarnView BD Task</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 20px;
            background-color: #f4f6f9;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: #ffffff;
            padding: 25px 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 350px;
            width: 100%;
        }
        h2 {
            font-size: 20px;
            color: #333;
            margin-bottom: 10px;
        }
        p {
            font-size: 14px;
            color: #666;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        .timer-box {
            font-size: 28px;
            font-weight: bold;
            color: #e74c3c;
            margin: 15px 0;
        }
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }
        .btn-ad {
            background-color: #0088cc;
            color: white;
            text-decoration: none;
            display: inline-block;
        }
        .btn-claim {
            background-color: #2ecc71;
            color: white;
        }
        .btn:disabled {
            background-color: #bdc3c7;
            color: #7f8c8d;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>EarnView BD Task</h2>
        <p>এড দেখা শেষ হওয়া পর্যন্ত পেজেই থাকুন। টাইমার শেষ হলে টাকা ক্লেইম করুন।</p>

        <!-- স্মার্ট লিঙ্কের বাটন -->
        <a href="https://www.effectivecpmnetwork.com/mub2fys1s?key=25d39d2df2a65324f9e407193357dee0" target="_blank" class="btn btn-ad" id="ad-btn" onclick="openAd()">▶️ এখানে ক্লিক করে এড দেখুন</a>

        <div class="timer-box" id="timer">২০</div>

        <button class="btn btn-claim" id="claim-btn" disabled onclick="completeTask()">💰 টাকা ক্লেইম করুন</button>
    </div>

    <script>
        let timeLeft = 20;
        let timerElement = document.getElementById('timer');
        let claimBtn = document.getElementById('claim-btn');
        let adOpened = false;

        function openAd() {
            adOpened = true;
        }

        // অটোমেটিক স্মার্ট লিঙ্ক ওপেন করা (যদি ইউজার ক্লিক না করে)
        window.onload = function() {
            setTimeout(function() {
                window.open("https://www.effectivecpmnetwork.com/mub2fys1s?key=25d39d2df2a65324f9e407193357dee0", "_blank");
            }, 1000);
        };

        let countdown = setInterval(() => {
            timeLeft--;
            timerElement.innerText = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(countdown);
                timerElement.innerText = "✅ সময় শেষ!";
                timerElement.style.color = "#2ecc71";
                timerElement.style.fontSize = "20px";
                claimBtn.disabled = false;
            }
        }, 1000);

        function completeTask() {
            if (window.Telegram && window.Telegram.WebApp) {
                Telegram.WebApp.sendData(JSON.stringify({ status: "success" }));
                Telegram.WebApp.close();
            } else {
                alert("টাস্ক সফল হয়েছে!");
            }
        }
    </script>
</body>
</html>

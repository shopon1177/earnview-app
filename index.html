<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EarnView Task</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 15px;
            background-color: #f4f4f9;
        }
        .header-title {
            font-size: 18px;
            color: #333;
            margin-bottom: 12px;
        }
        .ad-container {
            width: 100%;
            height: 380px;
            border: 2px dashed #0088cc;
            border-radius: 10px;
            margin-bottom: 15px;
            overflow: hidden;
            background-color: #ffffff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .timer-box {
            font-size: 16px;
            font-weight: bold;
            color: #d9534f;
            margin-bottom: 15px;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:disabled {
            background-color: #cccccc;
            color: #666666;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <h3 class="header-title">📺 ২০ সেকেন্ড মনোযোগ দিয়ে এডটি দেখুন</h3>

    <!-- স্মার্ট লিঙ্ক বসানো এড ফ্রেম -->
    <div class="ad-container">
        <iframe src="https://www.effectivecpmnetwork.com/mub2fys1s?key=25d39d2df2a65324f9e407193357dee0"></iframe>
    </div>

    <div class="timer-box" id="timer">টাইমার: ২০ সেকেন্ড বাকি</div>
    <button id="claim-btn" disabled onclick="completeTask()">💰 টাকা ক্লেম করুন</button>

    <script>
        let timeLeft = 20;
        let timerElement = document.getElementById('timer');
        let claimBtn = document.getElementById('claim-btn');

        let countdown = setInterval(() => {
            timeLeft--;
            timerElement.innerText = "টাইমার: " + timeLeft + " সেকেন্ড বাকি";
            if (timeLeft <= 0) {
                clearInterval(countdown);
                timerElement.innerText = "✅ সময় শেষ! এখন টাকা ক্লেম করুন।";
                timerElement.style.color = "#28a745";
                claimBtn.disabled = false;
            }
        }, 1000);

        function completeTask() {
            if (window.Telegram && window.Telegram.WebApp) {
                Telegram.WebApp.sendData(JSON.stringify({ status: "success" }));
                Telegram.WebApp.close();
            } else {
                alert("টাস্ক সফল হয়েছে!");
            }
        }
    </script>
</body>
</html>
